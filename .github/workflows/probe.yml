name: probe

# Diagnostic only: a single `echo` on a Linux runner. If this fails with zero steps, the
# problem is the account's Actions allowance rather than any workflow in this repository.
# Runs on demand only, so it never spends minutes on an ordinary push.

on:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Say hello
        run: echo "actions can run on this repository"
